<!-- Divider -->
<div class="flex items-center gap-sm mb-lg">
<div class="h-px bg-border-subtle flex-grow"></div>
<span class="font-label-sm text-label-sm text-outline uppercase tracking-widest">or email</span>
<div class="h-px bg-border-subtle flex-grow"></div>
</div>
<!-- Form Section -->
<form class="space-y-md flex-grow">
<!-- Email Input -->
<div class="space-y-xs group">
<label class="font-label-md text-label-md text-primary ml-1" for="email">Work Email</label>
<div class="relative flex items-center bg-surface-container-low rounded-lg border border-border-subtle focus-within:border-secondary focus-within:ring-2 focus-within:ring-secondary/20 transition-all duration-200">
<span class="material-symbols-outlined ml-md text-outline">mail</span>
<input class="w-full bg-transparent border-none focus:ring-0 py-sm px-sm font-body-md text-body-md text-on-surface placeholder:text-outline" id="email" placeholder="name@company.in" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-xs group">
<div class="flex justify-between items-center ml-1">
<label class="font-label-md text-label-md text-primary" for="password">Password</label>
<a class="font-label-sm text-label-sm text-secondary hover:underline transition-all" href="#">Forgot?</a>
</div>
<div class="relative flex items-center bg-surface-container-low rounded-lg border border-border-subtle focus-within:border-secondary focus-within:ring-2 focus-within:ring-secondary/20 transition-all duration-200">
<span class="material-symbols-outlined ml-md text-outline">lock</span>
<input class="w-full bg-transparent border-none focus:ring-0 py-sm px-sm font-body-md text-body-md text-on-surface placeholder:text-outline" id="password" placeholder="••••••••" type="password"/>
<button class="mr-md text-outline hover:text-secondary transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-sm px-1 py-xs">
<input class="w-4 h-4 rounded border-outline text-secondary focus:ring-secondary" id="remember" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant select-none" for="remember">Remember this device</label>
</div>
</form>
<!-- Bottom Actions -->
<div class="mt-xl space-y-md">
<button class="w-full bg-secondary text-on-secondary font-label-md text-label-md py-md px-lg rounded-xl linear-shadow hover:opacity-90 active:scale-95 transition-all duration-200">
                Sign In
            </button>
<p class="text-center font-body-sm text-body-sm text-on-surface-variant">
                Don't have an account? 
                <a class="text-secondary font-bold hover:underline" href="#">Request Access</a>
</p>
</div>
</main>
<!-- Footer Meta (Minimal for login) -->
<footer class="p-lg mt-auto">
<div class="flex flex-wrap justify-center gap-md mb-sm">
<a class="font-label-sm text-label-sm text-outline hover:text-secondary transition-colors" href="#">Privacy Policy</a>
<a class="font-label-sm text-label-sm text-outline hover:text-secondary transition-colors" href="#">Terms of Service</a>
<a class="font-label-sm text-label-sm text-outline hover:text-secondary transition-colors" href="#">Help</a>
</div>
<p class="text-center font-label-sm text-[10px] text-outline uppercase tracking-tighter opacity-60">
            © 2024 VANI AI • ENTERPRISE GRADE VOICE INTELLIGENCE
        </p>
</footer>
<!-- Interactive Layer for micro-animations -->
<script>
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('linear-shadow');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('linear-shadow');
            });
        });

        // Simple button active state toggle
        const signInBtn = document.querySelector('button.bg-secondary');
        signInBtn.addEventListener('mousedown', () => signInBtn.style.transform = 'scale(0.98)');
        signInBtn.addEventListener('mouseup', () => signInBtn.style.transform = 'scale(1)');
        signInBtn.addEventListener('mouseleave', () => signInBtn.style.transform = 'scale(1)');
    </script>

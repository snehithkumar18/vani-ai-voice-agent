<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant block" for="email">Email Address</label>

</div>

<label class="font-label-md text-label-md text-on-surface-variant block" for="password">Password</label>
<a class="font-label-sm text-label-sm text-secondary hover:underline" href="#">Forgot password?</a>
</div>
<input class="w-full px-md py-sm rounded-lg border border-outline-variant bg-surface-white font-body-md text-body-md text-on-surface input-focus-custom transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>

<button class="w-full bg-secondary text-on-secondary font-label-md text-label-md py-sm px-md rounded-lg shadow-sm hover:opacity-90 active:scale-[0.98] transition-all duration-200" type="submit">

</div>
<div class="flex items-center gap-xs">
